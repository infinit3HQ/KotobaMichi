# Local stack. For day-to-day work, `docker compose up -d db` plus `pnpm dev` is usually enough.
# Production stacks live in deploy/.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kotobamichi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kotobamichi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kotobamichi-network

  migration:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migration
    image: kotobamichi-migration:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kotobamichi}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - kotobamichi-network

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: kotobamichi-api:local
    container_name: kotobamichi-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kotobamichi}?schema=public
      PORT: 3001
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev_super_secret_jwt_key_that_is_very_long}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
      CORS_ORIGIN: "http://localhost:3000"
    ports:
      - "3001:3001"
    networks:
      - kotobamichi-network

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: kotobamichi-web:local
    container_name: kotobamichi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - kotobamichi-network

networks:
  kotobamichi-network:
    name: kotobamichi-network
    driver: bridge

volumes:
  postgres_data:
