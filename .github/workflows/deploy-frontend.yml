name: Deploy Frontend

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'KotobaMichi-Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      next_public_api_url:
        description: "Override NEXT_PUBLIC_API_URL (optional)"
        required: false
        type: string
      frontend_port:
        description: "Override FRONTEND_PORT (optional, default 8080)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/infinit3hq/kotobamichi-frontend
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./KotobaMichi-Frontend
          file: ./KotobaMichi-Frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on:
      - serverone
      - self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Frontend Stack
        shell: bash
        run: |
          set -euo pipefail
          cd KotobaMichi-Frontend
          docker network inspect kotobamichi-network >/dev/null 2>&1 || docker network create kotobamichi-network
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
