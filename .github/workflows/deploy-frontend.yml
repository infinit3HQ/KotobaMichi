name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'KotobaMichi-Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      next_public_api_url:
        description: "Override NEXT_PUBLIC_API_URL (optional)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/infinit3hq/kotobamichi-web

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./KotobaMichi-Frontend
          file: ./KotobaMichi-Frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/infinit3hq/kotobamichi-web
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=frontend-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/infinit3hq/kotobamichi-web
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/infinit3hq/kotobamichi-web@sha256:%s ' *)

  deploy:
    name: Deploy to Server
    needs: merge
    runs-on:
      - serverone
      - self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or restore .env for Frontend
        shell: bash
        env:
          NEXT_PUBLIC_API_URL_INPUT: ${{ inputs.next_public_api_url }}
          NEXT_PUBLIC_API_URL_SECRET: ${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_API_URL_VAR: ${{ vars.NEXT_PUBLIC_API_URL }}
          S3_PUBLIC_URL_SECRET: ${{ secrets.PROD_S3_PUBLIC_URL }}
        run: |
          set -euo pipefail
          cd KotobaMichi-Frontend

          NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL_INPUT:-}"; [ -n "$NEXT_PUBLIC_API_URL" ] || NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL_SECRET:-}"; [ -n "$NEXT_PUBLIC_API_URL" ] || NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL_VAR:-https://kotobamichi-api.012140.xyz/v1}"
          NEXT_PUBLIC_S3_PUBLIC_URL="${S3_PUBLIC_URL_SECRET:-https://s3-kotobamichi.012140.xyz/kotobamichi}"

          echo "Generating .env for Frontend..."
          {
            echo "# Auto-generated by CI on $(date -u)"
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
            echo "NEXT_PUBLIC_S3_PUBLIC_URL=$NEXT_PUBLIC_S3_PUBLIC_URL"
          } > .env

      - name: Deploy Frontend Stack
        shell: bash
        run: |
          set -euo pipefail
          cd KotobaMichi-Frontend
          docker network inspect kotobamichi-network >/dev/null 2>&1 || docker network create kotobamichi-network
          docker network inspect proxy >/dev/null 2>&1 || docker network create proxy
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
