name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filter:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
      api: ${{ steps.changes.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'content/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.npmrc'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.npmrc'
              - 'turbo.json'
              - '.github/workflows/ci.yml'

  web:
    name: Web (lint, typecheck, test, build)
    needs: filter
    if: ${{ needs.filter.outputs.web == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build --filter=@kotobamichi/web...

  api:
    name: API (lint, typecheck, test, build)
    needs: filter
    if: ${{ needs.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build --filter=@kotobamichi/api...
