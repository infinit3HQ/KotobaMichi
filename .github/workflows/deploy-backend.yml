name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'deploy/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/infinit3hq/kotobamichi-api
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Migration Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile.migration
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/infinit3hq/kotobamichi-migration:latest
            ghcr.io/infinit3hq/kotobamichi-migration:${{ github.ref_name }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

  deploy:
    name: Deploy to Server
    # Secrets live in the production environment, which only main can deploy to.
    environment:
      name: production
      url: https://kotobamichi-api.012140.xyz
    needs: build-and-push
    runs-on:
      - serverone
      - self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server keeps the API's secrets in a root-only file outside the checkout
      # (default /etc/kotobamichi/api.env, override with the API_ENV_FILE repository variable).
      # GitHub secrets only overlay the Google OAuth and S3 settings. There are no fallback values:
      # if the file is missing the deploy stops instead of starting with guessed or stale secrets.
      - name: Write .env for Backend
        shell: bash
        env:
          API_ENV_FILE: ${{ vars.API_ENV_FILE || '/etc/kotobamichi/api.env' }}
          GOOGLE_CLIENT_ID_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL_SECRET: ${{ secrets.PROD_GOOGLE_CALLBACK_URL }}
          S3_ENDPOINT_SECRET: ${{ vars.PROD_S3_ENDPOINT }}
          S3_REGION_SECRET: ${{ vars.PROD_S3_REGION }}
          S3_BUCKET_SECRET: ${{ vars.PROD_S3_BUCKET }}
          S3_PUBLIC_URL_SECRET: ${{ vars.PROD_S3_PUBLIC_URL }}
          S3_ACCESS_KEY_ID_SECRET: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY_SECRET: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          cd deploy/api

          if [ ! -s "$API_ENV_FILE" ]; then
            echo "::error::$API_ENV_FILE is missing or empty on this runner. Create it (mode 600) from apps/api/.env.example before deploying."
            exit 1
          fi
          cp "$API_ENV_FILE" .env

          # Compose expands $NAME inside .env values, so a literal $ must be written as $$.
          upsert_env() {
            local key="$1" value="$2"
            [ -n "$value" ] || return 0
            grep -v -E "^${key}=" .env > .env.tmp || true
            mv .env.tmp .env
            printf '%s=%s\n' "$key" "${value//\$/\$\$}" >> .env
          }

          if [ -n "$GOOGLE_CLIENT_ID_SECRET" ]; then
            upsert_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID_SECRET"
            upsert_env GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET_SECRET"
            upsert_env GOOGLE_CALLBACK_URL "$GOOGLE_CALLBACK_URL_SECRET"
          fi
          upsert_env S3_ENDPOINT "$S3_ENDPOINT_SECRET"
          upsert_env S3_REGION "$S3_REGION_SECRET"
          upsert_env S3_BUCKET "$S3_BUCKET_SECRET"
          upsert_env S3_PUBLIC_URL "$S3_PUBLIC_URL_SECRET"
          upsert_env S3_ACCESS_KEY_ID "$S3_ACCESS_KEY_ID_SECRET"
          upsert_env S3_SECRET_ACCESS_KEY "$S3_SECRET_ACCESS_KEY_SECRET"

          missing=""
          for key in DATABASE_URL JWT_SECRET COOKIE_SECRET APP_URL CORS_ORIGIN; do
            grep -q -E "^${key}=.+" .env || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::Required settings missing from .env:$missing"
            exit 1
          fi
          echo "Wrote deploy/api/.env from $API_ENV_FILE ($(grep -c '=' .env) settings)."

      - name: Deploy Backend Stack & Migrations
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/api
          docker network inspect kotobamichi-network >/dev/null 2>&1 || docker network create kotobamichi-network
          docker network inspect proxy >/dev/null 2>&1 || docker network create proxy
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
