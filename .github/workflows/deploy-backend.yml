name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'deploy/api/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.npmrc'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/infinit3hq/kotobamichi-api
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Extract metadata (migration)
        id: meta-migration
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/infinit3hq/kotobamichi-migration
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Migration Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile.migration
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-migration.outputs.tags }}
          labels: ${{ steps.meta-migration.outputs.labels }}
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

  deploy:
    name: Deploy to Server
    # Secrets live in the production environment, which only main can deploy to.
    environment:
      name: production
      url: https://kotobamichi-api.012140.xyz
    needs: build-and-push
    runs-on:
      - serverone
      - self-hosted
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every API setting lives in the production GitHub environment: API_<NAME> secrets for
      # credentials, API_<NAME> variables for the rest. Each one becomes NAME in deploy/api/.env.
      # Variables are picked up automatically. Secrets are listed by name below so this step
      # only ever sees the secrets it needs; a new secret must be added to that list.
      - name: Write .env for Backend
        shell: bash
        env:
          ENV_VARS: ${{ toJSON(vars) }}
          API_ADMIN_EMAIL: ${{ secrets.API_ADMIN_EMAIL }}
          API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
          API_COOKIE_SECRET: ${{ secrets.API_COOKIE_SECRET }}
          API_DATABASE_URL: ${{ secrets.API_DATABASE_URL }}
          API_GOOGLE_CLIENT_SECRET: ${{ secrets.API_GOOGLE_CLIENT_SECRET }}
          API_JWT_SECRET: ${{ secrets.API_JWT_SECRET }}
          API_POSTGRES_PASSWORD: ${{ secrets.API_POSTGRES_PASSWORD }}
          API_S3_SECRET_ACCESS_KEY: ${{ secrets.API_S3_SECRET_ACCESS_KEY }}
          API_SMTP_PASS: ${{ secrets.API_SMTP_PASS }}
          API_SMTP_USER: ${{ secrets.API_SMTP_USER }}
        run: |
          set -euo pipefail
          umask 077
          cd deploy/api
          python3 - <<'PY'
          import json, os, re, sys

          settings = {}
          for name, value in json.loads(os.environ.get("ENV_VARS") or "{}").items():
              if name.startswith("API_") and value is not None:
                  settings[name[len("API_"):]] = str(value)
          # Secrets come in as API_* step variables and win over variables with the same name.
          # An unset secret arrives as an empty string and is skipped.
          for name, value in os.environ.items():
              if name.startswith("API_") and value:
                  settings[name[len("API_"):]] = value

          problems = []
          for key, value in settings.items():
              if not re.fullmatch(r"[A-Z_][A-Z0-9_]*", key):
                  problems.append(f"{key}: not a valid variable name")
              if "\n" in value or "\r" in value:
                  problems.append(f"{key}: value spans several lines")
          required = ["DATABASE_URL", "JWT_SECRET", "COOKIE_SECRET", "APP_URL", "CORS_ORIGIN"]
          problems += [f"{key}: missing" for key in required if not settings.get(key)]
          if problems:
              for problem in problems:
                  print(f"::error::API_{problem}")
              sys.exit(1)

          # Compose expands $NAME inside .env values, so a literal $ is written as $$.
          with open(".env", "w") as env_file:
              for key in sorted(settings):
                  env_file.write(f"{key}={settings[key].replace('$', '$$')}\n")
          print(f"Wrote deploy/api/.env with {len(settings)} settings from the production environment.")
          PY

      - name: Deploy Backend Stack & Migrations
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/api
          docker network inspect kotobamichi-network >/dev/null 2>&1 || docker network create kotobamichi-network
          docker network inspect proxy >/dev/null 2>&1 || docker network create proxy
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
