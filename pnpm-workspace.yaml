packages:
  - KotobaMichi-Frontend
  - KotobaMichi-Backend

nodeLinker: hoisted
hoistPattern:
  - '*'
publicHoistPattern:
  - next
  - '@next/*'

allowBuilds:
  '@swc/core': true
  bcrypt: true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  sharp: 0.35.5
  postcss: 8.5.32
  multer: 2.5.0
  proxy-addr: 2.0.8
  handlebars: 4.7.10
  "body-parser@<2.4.0": 2.4.0
  "fast-uri@>=3.0.0 <3.1.9": 3.1.9
  "follow-redirects@<1.16.2": 1.16.2
  "http-cache-semantics@<=4.2.0": 4.3.0
  "source-map-js@<1.2.2": 1.2.2
  "brace-expansion@<1.1.21": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.7": 2.1.7
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  "esbuild@<=0.24.2": 0.25.12
  "file-type@>=13.0.0 <21.3.2": 21.3.4
