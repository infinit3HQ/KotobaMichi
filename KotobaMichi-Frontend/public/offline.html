<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · KotobaMichi</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #faf8f5;
        color: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0c0f17; color: #f5f5f4; }
      }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.4rem; margin: 1.25rem 0 0.5rem; }
      p { line-height: 1.6; opacity: 0.8; margin: 0.4rem 0; }
      button {
        margin-top: 1.25rem;
        padding: 0.6rem 1.2rem;
        border: 0;
        border-radius: 999px;
        background: #d9363e;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page isn't saved on this device yet. Pages you've opened before still work offline.</p>
      <p lang="si">ඔබ අන්තර්ජාලයට සම්බන්ධ නැහැ. කලින් විවෘත කළ පිටු නොබැඳිව ක්‍රියා කරයි.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
