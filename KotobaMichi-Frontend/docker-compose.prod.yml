services:
  web:
    container_name: kotobamichi-web
    image: ghcr.io/infinit3hq/kotobamichi-web:latest
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    networks:
      - kotobamichi-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.kotobamichi-web.entrypoints=websecure"
      - "traefik.http.routers.kotobamichi-web.rule=Host(`kotobamichi.012140.xyz`)"
      - "traefik.http.routers.kotobamichi-web.tls.certresolver=cloudflare"
      - "traefik.http.services.kotobamichi-web.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  kotobamichi-network:
    external: true
  proxy:
    external: true
